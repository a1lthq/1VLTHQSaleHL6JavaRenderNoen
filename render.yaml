services:
  - type: web
    name: highlands-coffee
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.index:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
