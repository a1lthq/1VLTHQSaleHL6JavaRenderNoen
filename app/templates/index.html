{% extends 'layout/base.html' %}{% block content %}
<h1 class="mt-4">Menu Highlands Coffee</h1><div class="row">{% for p in products %}<div class="col-md-3 col-sm-6 p-3"><div class="card h-100"><img class="card-img-top" src="{{ p.image|product_image }}" alt="{{ p.name }}"><div class="card-body"><h5>{{ p.name }} {% if p.size %}({{ p.size }}){% endif %}</h5><p>{{ '{:,.0f}'.format(p.price) }} VNĐ</p><a href="{{ url_for('detail',product_id=p.id) }}" class="btn btn-outline-dark">Chi tiết</a><form class="d-inline" method="post" action="{{ url_for('cart_change',product_id=p.id) }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button name="action" value="add" class="btn btn-danger">Đặt hàng</button></form></div></div></div>{% else %}<p>Không có sản phẩm.</p>{% endfor %}</div>{% endblock %}
