{% extends 'layout/base.html' %}{% block content %}<div class="row mt-4"><div class="col-md-4"><img class="img-fluid" src="{{ product.image|product_image }}" alt="{{ product.name }}"></div><div class="col-md-8"><h1>{{ product.name }} {{ product.size or '' }}</h1><p>{{ product.description or '' }}</p>{% if product.price is not none %}<h3>{{ '{:,.0f}'.format(product.price) }} VNĐ</h3><form method="post" action="{{ url_for('cart_change',product_id=product.id) }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn btn-danger" name="action" value="add">Thêm giỏ hàng</button></form>{% endif %}</div></div>{% endblock %}
